name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: 语法编译
        run: python -m compileall backend/app backend/scripts
      - name: 基础 Lint（语法/未定义名）
        run: ruff check --select E9,F63,F7,F82 backend/app backend/scripts
      - name: 七链路 smoke 验收
        working-directory: backend
        run: PYTHONIOENCODING=utf-8 python scripts/smoke_test.py
      - name: LLM 离线验证
        working-directory: backend
        run: PYTHONIOENCODING=utf-8 python scripts/llm_offline_test.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -f backend/Dockerfile -t wl-travel-backend:ci .
