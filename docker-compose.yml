services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 全量透传 .env（替代此前的白名单转发：白名单会静默丢弃
    # AUTH_* / RECLAIM_INTERVAL_SECONDS / LLM_TEMPERATURE / EXTERNAL_* 等变量）
    env_file:
      - .env
    environment:
      # 容器内覆盖项：服务发现与挂载路径必须与 compose 拓扑一致，.env 里的本机值不适用
      QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: travel_plan_jobs
      REDIS_GROUP: plan_workers
      DATA_ROOT: /data/jobs
      # DATABASE_URL 若指向本机 localhost 在容器内不可达，改为服务名（未启用 postgres profile 时保持为空）
      DATABASE_URL: ${DATABASE_URL:-}
      # 宿主机 Ollama（embedding/LLM 兜底）：.env 里的 host.docker.internal 仅供容器访问；
      # 裸跑后端在 config.py 中自动兜底改写为 http://127.0.0.1:11434，容器内保持原值
      EMBEDDING_OLLAMA_URL: ${EMBEDDING_OLLAMA_URL:-http://host.docker.internal:11434}
      # 告警桥接：Alertmanager webhook 回调鉴权（生产必改）
      ALERT_BRIDGE_TOKEN: ${ALERT_BRIDGE_TOKEN:-alert-bridge-change-me}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      # 前端构建产物以挂载方式提供：宿主先 npm run build（frontend/dist），
      # 改前端无需重建镜像，杜绝"改了没同步"的静默过期问题；dist 缺失时后端仅提供 API。
      - ./frontend/dist:/app/web:ro
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # 生产演进：PostgreSQL 镜像层（审计/任务跨实例落库 + pgvector 语义检索）
  # 启用：docker compose --profile postgres up -d，并设置 DATABASE_URL=postgresql+psycopg://wl:wl@postgres:5432/wl_travel
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wl
      POSTGRES_PASSWORD: wl
      POSTGRES_DB: wl_travel
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wl -d wl_travel"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 生产演进：监控（Prometheus 抓取 backend /metrics + Grafana 看板）
  # 启用：docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9091:9090"

  # P3.2 告警分发：Alertmanager → backend 桥接端点 → 飞书群机器人
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3300:3000"

volumes:
  redis-data:
  pg-data:
  grafana-data:
