services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 全量透传 .env（替代此前的白名单转发：白名单会静默丢弃
    # AUTH_* / RECLAIM_INTERVAL_SECONDS / LLM_TEMPERATURE / EXTERNAL_* 等变量）
    env_file:
      - .env
    environment:
      # 容器内覆盖项：服务发现与挂载路径必须与 compose 拓扑一致，.env 里的本机值不适用
      QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: travel_plan_jobs
      REDIS_GROUP: plan_workers
      DATA_ROOT: /data/jobs
      # DATABASE_URL 若指向本机 localhost 在容器内不可达，改为服务名（未启用 postgres profile 时保持为空）
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      # 前端以挂载方式提供：改 HTML 无需重建镜像，杜绝"改了没同步"的静默过期问题
      - ./frontend:/app/frontend:ro
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # 生产演进：PostgreSQL 镜像层（审计/任务跨实例落库 + pgvector 语义检索）
  # 启用：docker compose --profile postgres up -d，并设置 DATABASE_URL=postgresql+psycopg://wl:wl@postgres:5432/wl_travel
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: wl
      POSTGRES_PASSWORD: wl
      POSTGRES_DB: wl_travel
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  # 生产演进：监控（Prometheus 抓取 backend /metrics + Grafana 看板）
  # 启用：docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3300:3000"

volumes:
  redis-data:
  pg-data:
  grafana-data:
